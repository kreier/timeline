name: Update Downstream

on:
  push:
    branches:
      - main
    paths:
      - 'db/dictionary_*.csv'

  workflow_dispatch:

concurrency:
  group: update-downstream-main
  cancel-in-progress: false

jobs:
  update-downstream:
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------
      # App 2: update-timeline
      # Generate installation tokens for the three downstream owners
      # ------------------------------------------------------------
      - name: Generate update-timeline token for kreier
        id: update-token-kreier
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.UPDATE_TIMELINE_APP_ID }}
          private-key: ${{ secrets.UPDATE_TIMELINE_PRIVATE_KEY }}
          owner: kreier
          repositories: |
            dictionary

      - name: Generate update-timeline token for timeline24
        id: update-token-timeline24
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.UPDATE_TIMELINE_APP_ID }}
          private-key: ${{ secrets.UPDATE_TIMELINE_PRIVATE_KEY }}
          owner: timeline24
          repositories: |
            timeline24.github.io

      - name: Generate update-timeline token for timeline25
        id: update-token-timeline25
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.UPDATE_TIMELINE_APP_ID }}
          private-key: ${{ secrets.UPDATE_TIMELINE_PRIVATE_KEY }}
          owner: timeline25
          repositories: |
            timeline25.github.io

      # ------------------------------------------------------------
      # Trigger downstream updates
      # These run only after the timeline commit succeeded.
      # ------------------------------------------------------------
      - name: Trigger dictionary update
        env:
          GH_TOKEN: ${{ steps.update-token-kreier.outputs.token }}
        run: |
          gh api repos/kreier/dictionary/dispatches \
            -f event_type=timeline-updated \
            -f client_payload[repository]=kreier/timeline

      - name: Trigger Timeline24 update
        env:
          GH_TOKEN: ${{ steps.update-token-timeline24.outputs.token }}
        run: |
          gh api repos/timeline24/timeline24.github.io/dispatches \
            -f event_type=timeline-updated \
            -f client_payload[repository]=kreier/timeline

      - name: Trigger Timeline25 update
        env:
          GH_TOKEN: ${{ steps.update-token-timeline25.outputs.token }}
        run: |
          gh api repos/timeline25/timeline25.github.io/dispatches \
            -f event_type=timeline-updated \
            -f client_payload[repository]=kreier/timeline
