name: Approve Translation Submission

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      lang:
        description: 'Language code (e.g. nl, de)'
        required: false
        type: string

# Guarantees jobs process one at a time sequentially instead of racing each other
concurrency:
  group: approve-translation-main
  cancel-in-progress: false

jobs:
  approve-and-apply:
    # Update 'if' to allow manual execution OR comment triggers
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.issue.pull_request == null &&
        (startsWith(github.event.comment.body, '/approve') || startsWith(github.event.comment.body, '/approved')) &&
        (github.event.comment.author_association == 'OWNER' ||
         github.event.comment.author_association == 'MEMBER' ||
         github.event.comment.author_association == 'COLLABORATOR')
       )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      # ------------------------------------------------------------ 
      # App 1: dictionary-update 
      # Used for checkout and committing changes to kreier/timeline 
      # ------------------------------------------------------------
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.DICTIONARY_UPDATE_APP_ID }}
          private-key: ${{ secrets.DICTIONARY_UPDATE_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: timeline

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # ------------------------------------------------------------ 
      # Apply approved translations 
      # ------------------------------------------------------------
      - name: Apply translation updates to CSV
        id: apply_changes
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python - << 'EOF'
          import os
          import csv
          import json
          import re
          import sys

          issue_body = os.environ.get("ISSUE_BODY", "")

          # Extract JSON from issue body
          match = re.search(r"<!-- SUBMISSION_JSON_START -->.*?```json\s*(.*?)\s*```.*?<!-- SUBMISSION_JSON_END -->", issue_body, re.DOTALL)
          if not match:
              # Fallback match for standard ```json
              match = re.search(r"```json\s*(\{.*?\})\s*```", issue_body, re.DOTALL)

          if not match:
              print("❌ Could not find machine JSON payload in issue body.")
              sys.exit(1)

          payload = json.loads(match.group(1))
          lang = payload.get("lang")
          editor = payload.get("editor", "anonymous")
          date_str = payload.get("date", "")
          changes = payload.get("changes", [])

          csv_path = os.path.join("db", f"dictionary_{lang}.csv")
          if not os.path.exists(csv_path):
              print(f"❌ Target CSV file not found: {csv_path}")
              sys.exit(1)

          # Read existing CSV
          with open(csv_path, mode="r", encoding="utf-8-sig") as f:
              reader = csv.DictReader(f)
              fieldnames = reader.fieldnames
              rows = list(reader)

          # Create lookup for changes by key
          change_map = {c["key"]: c for c in changes}
          applied_keys = []

          for row in rows:
              key = row.get("key", "").strip()
              if key in change_map:
                  c = change_map[key]
                  if "text" in c:
                      row["text"] = c["text"]
                  if "notes" in c:
                      row["notes"] = c["notes"]
                  if "checked" in c:
                      row["checked"] = c["checked"]
                      row["checked_by"] = editor
                      if date_str:
                          row["date"] = date_str
                  applied_keys.append(key)

          # Write back to CSV
          with open(csv_path, mode="w", encoding="utf-8", newline="") as f:
              writer = csv.DictWriter(f, fieldnames=fieldnames)
              writer.writeheader()
              writer.writerows(rows)

          print(f"✅ Successfully updated {len(applied_keys)} keys in {csv_path}: {applied_keys}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as gh_out:
              gh_out.write(f"lang={lang}\n")
              gh_out.write(f"count={len(applied_keys)}\n")
              gh_out.write(f"editor={editor}\n")
          EOF

      # ------------------------------------------------------------ 
      # Commit and push to kreier/timeline 
      # ------------------------------------------------------------
      - name: Commit and push changes
        run: |
          git config user.name "dictionary-update[bot]"
          git config user.email "4801970+dictionary-update[bot]@users.noreply.github.com"
          git add db/dictionary_${{ steps.apply_changes.outputs.lang }}.csv
          git commit -m "Update dictionary_${{ steps.apply_changes.outputs.lang }}.csv (${{ steps.apply_changes.outputs.count }} entries approved by ${{ github.event.comment.user.login }})"
          
          # Pull latest remote changes with rebase before pushing
          git pull --rebase origin main
          git push origin main
          

      # ------------------------------------------------------------
      # App 2: update-timeline
      # Generate installation tokens for the three downstream owners
      # ------------------------------------------------------------
      - name: Generate update-timeline token for kreier
        id: update-token-kreier
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.UPDATE_TIMELINE_APP_ID }}
          private-key: ${{ secrets.UPDATE_TIMELINE_PRIVATE_KEY }}
          owner: kreier
          repositories: |
            dictionary

      - name: Generate update-timeline token for timeline24
        id: update-token-timeline24
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.UPDATE_TIMELINE_APP_ID }}
          private-key: ${{ secrets.UPDATE_TIMELINE_PRIVATE_KEY }}
          owner: timeline24
          repositories: |
            timeline24.github.io

      - name: Generate update-timeline token for timeline25
        id: update-token-timeline25
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.UPDATE_TIMELINE_APP_ID }}
          private-key: ${{ secrets.UPDATE_TIMELINE_PRIVATE_KEY }}
          owner: timeline25
          repositories: |
            timeline25.github.io

      # ------------------------------------------------------------
      # Trigger downstream updates
      # These run only after the timeline commit succeeded.
      # ------------------------------------------------------------
      - name: Trigger dictionary update
        env:
          GH_TOKEN: ${{ steps.update-token-kreier.outputs.token }}
        run: |
          gh api repos/kreier/dictionary/dispatches \
            -f event_type=timeline-updated \
            -f client_payload[repository]=kreier/timeline

      - name: Trigger Timeline24 update
        env:
          GH_TOKEN: ${{ steps.update-token-timeline24.outputs.token }}
        run: |
          gh api repos/timeline24/timeline24.github.io/dispatches \
            -f event_type=timeline-updated \
            -f client_payload[repository]=kreier/timeline

      - name: Trigger Timeline25 update
        env:
          GH_TOKEN: ${{ steps.update-token-timeline25.outputs.token }}
        run: |
          gh api repos/timeline25/timeline25.github.io/dispatches \
            -f event_type=timeline-updated \
            -f client_payload[repository]=kreier/timeline

      # ------------------------------------------------------------
      # Close issue and report success
      # ------------------------------------------------------------
      - name: Close Issue with Confirmation
        uses: actions/github-script@v9
        with:
          script: |
            const comment = `✅ **Approved and Applied!** 
            
            Updated **${{ steps.apply_changes.outputs.count }}** entries in \`db/dictionary_${{ steps.apply_changes.outputs.lang }}.csv\` (contributed by *${{ steps.apply_changes.outputs.editor }}*). 
            
            Commit pushed to \`main\`. 
            
            Downstream updates triggered: 
            - \`kreier/dictionary\` 
            - \`timeline24/timeline24.github.io\` 
            - \`timeline25/timeline25.github.io\``;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment
            });
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['approved']
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });
            
      - name: Get Timeline commit SHA
        id: timeline_commit
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
